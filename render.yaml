services:
  - type: web
    name: stockscope-private-beta
    runtime: node
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRIVATE_BETA
        value: "true"
      - key: BETA_UNLIMITED
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: APP_URL
        value: https://stockscope-private-beta.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: API_RATE_LIMIT
        value: "120"
      - key: EXPENSIVE_RATE_LIMIT
        value: "20"
      - key: EODHD_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: BETA_USERNAME
        sync: false
      - key: BETA_PASSWORD
        sync: false
