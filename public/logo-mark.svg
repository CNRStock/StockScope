<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">StockScope logo</title>
  <desc id="desc">A scope lens containing a rising market path.</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="7" x2="57" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7ff55"/>
      <stop offset=".48" stop-color="#9cff4b"/>
      <stop offset="1" stop-color="#67a8ff"/>
    </linearGradient>
    <linearGradient id="path" x1="19" y1="43" x2="47" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1218"/>
      <stop offset="1" stop-color="#182333"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#tile)" transform="rotate(7 32 32)"/>
  <circle cx="31" cy="31" r="17" fill="none" stroke="#0b1118" stroke-width="4.5" opacity=".94"/>
  <path d="M18.5 41.5 25 34l6 4 8.5-11 6 1" fill="none" stroke="url(#path)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m40.5 22.5 7 4.5-7.5 3" fill="none" stroke="#101923" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m43.5 43.5 8 8" stroke="#0b1118" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
